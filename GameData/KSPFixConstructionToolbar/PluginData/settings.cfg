// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Lets the pointer through the warp-to-morning drawer, below the time display, while the drawer is closed.
// On stock, the drawer's mask is an invisible rectangle there that always takes the pointer: resting the
// pointer on the top of the Place tool, in EVA construction mode, slides the drawer down, and its sunrise
// button lands under the pointer, so the click warps to the next morning. Open, the drawer works as on stock.
closedDrawerLetsPointerThrough = True

// Moves the EVA construction mode's tools and list of parts down below the time display when the next alarm
// shows above it (the alarm clock button, left of the time display). On stock, the time display then covers
// the top of the tools and the first row of the list.
constructionModeBelowAlarm = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time the fix
// finds the drawer of a time display or the construction mode's block, and one each time the block moves.
logLevel = Info
